name: Playwright DB Tests

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Select browser'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      testFile:
        description: "Select the test to run"
        required: true
        type: choice
        options:
          - all
          - sql-schema.test.ts
          - sql-queries.test.ts
          - sql-joins.test.ts
          - sql-excelVal.test.ts
          - etlValidation.test.ts
      services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Tester@08
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5 

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60


    steps:
      - name: Install MySQL client
        run: sudo apt-get install -y mysql-client

      - name: Load schemas and data
        run: |
          declare -A DBS
          DBS=( ["sqldb"]="testAssets/testData/sqldb" ["sourcedb"]="testAssets/testData/sourcedb" ["targetdb"]="testAssets/testData/targetdb" )

          for DB in "${!DBS[@]}"; do
            echo "Loading database $DB..."
            SCHEMA_PATH="${DBS[$DB]}/schema.sql"
            DATA_PATH="${DBS[$DB]}/data.sql"

            mysql -h mysql -uroot -p"${{ secrets.MYSQL_ROOT_PASSWORD }}" -e "CREATE DATABASE IF NOT EXISTS $DB;"
            mysql -h mysql -uroot -p"${{ secrets.MYSQL_ROOT_PASSWORD }}" $DB < $SCHEMA_PATH
            mysql -h mysql -uroot -p"${{ secrets.MYSQL_ROOT_PASSWORD }}" $DB < $DATA_PATH
          done
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Create .env for DB connection
        run: |
          echo DB_HOST=${{ secrets.DB_HOST }} >> .env
          echo DB_USER=${{ secrets.DB_USER }} >> .env
          echo DB_PASSWORD=${{ secrets.DB_PASSWORD }} >> .env
          echo DB_NAME=${{ secrets.DB_NAME }} >> .env

      - name: Run Playwright tests
        continue-on-error: true
        run: npx playwright test --project=chromium

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

