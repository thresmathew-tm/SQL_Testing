name: Playwright DB Tests

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Select browser'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      testFile:
        description: "Select the test to run"
        required: true
        type: choice
        options:
          - all
          - sql-schema.test.ts
          - sql-queries.test.ts
          - sql-joins.test.ts
          - sql-excelVal.test.ts
          - etlValidation.test.ts

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Tester@08
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..20}; do
            mysqladmin ping -h 127.0.0.1 -uroot -p"Tester@08" &>/dev/null && break
            echo "Waiting for MySQL..."
            sleep 5
          done

      - name: Load schemas and data
        run: |
         declare -A DBS
          DBS=( 
            ["sqldb"]="testAssets/testData/sqldb" 
            ["sourcedb"]="testAssets/testData/sourcedb" 
            ["targetdb"]="testAssets/testData/targetdb" 
          )

          for DB in "${!DBS[@]}"; do
            echo "Loading database $DB..."
            
            SCHEMA_PATH="${DBS[$DB]}/schema.sql"
            DATA_PATH="${DBS[$DB]}/data.sql"

            # Create database
            mysql -h 127.0.0.1 -uroot -p"Tester@08" -e "CREATE DATABASE IF NOT EXISTS $DB;"

            # Load schema
            echo "→ Loading schema for $DB"
            mysql -h 127.0.0.1 -uroot -p"Tester@08" $DB < "$SCHEMA_PATH"

            # Load data ONLY IF data.sql exists
            if [[ -f "$DATA_PATH" ]]; then
              echo "→ Loading data for $DB"
              mysql -h 127.0.0.1 -uroot -p"Tester@08" $DB < "$DATA_PATH"
            else
              echo "→ No data.sql found for $DB (skipping data load)"
            fi

          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        continue-on-error: true
        run: npx playwright test --project=chromium

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30