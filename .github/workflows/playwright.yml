name: Playwright DB Tests

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Select browser'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      testFile:
        description: "Select the test to run"
        required: true
        type: choice
        options:
          - all
          - sql-schema.test.ts
          - sql-queries.test.ts
          - sql-joins.test.ts
          - sql-excelVal.test.ts
          - etlValidation.test.ts

services:
  mysql:
    image: mysql:8
    ports:
      - 3306:3306
    env:
      MYSQL_ROOT_PASSWORD: Tester@08
      MYSQL_DATABASE: sqldb
    options: >-
      --health-cmd="mysqladmin ping --silent"
      --health-interval=10s
      --health-timeout=5s
      --health-retries=3

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Create .env for DB connection
        run: |
          echo DB_HOST=${{ secrets.DB_HOST }} >> .env
          echo DB_USER=${{ secrets.DB_USER }} >> .env
          echo DB_PASSWORD=${{ secrets.DB_PASSWORD }} >> .env
          echo DB_NAME=${{ secrets.DB_NAME }} >> .env

      - name: Run Playwright tests
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.testFile }}" = "all" ]; then
            echo "Running ALL tests..."
            npx playwright test --project=${{ github.event.inputs.browser }}
          else
            echo "Running only selected test: ${{ github.event.inputs.testFile }}"
            npx playwright test testAssets/tests/${{ github.event.inputs.testFile }} --project=${{ github.event.inputs.browser }}
          fi

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          
